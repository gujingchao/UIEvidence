name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UIEV_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install Chrome for integration and end-to-end tests
        run: npx playwright install --with-deps chrome
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - run: npm audit
